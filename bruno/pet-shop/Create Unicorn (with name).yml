info:
  name: Create Unicorn (with name)
  type: http
  seq: 2

http:
  method: POST
  url: http://localhost:8080/api/pets
  body:
    type: json
    data: |-
      {
        "name": "Stella",
        "kind": "UNICORN"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
